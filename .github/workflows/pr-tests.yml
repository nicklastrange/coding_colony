name: PR Tests

on:
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Installer integrity tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate JSON config
        run: |
          python -m json.tool config/providers.json >/dev/null
          python -m json.tool config/plugins.json >/dev/null
          python -m json.tool config/roles.json >/dev/null

      - name: Compile Python files
        run: |
          python -m py_compile scripts/agent_setup.py tests/test_installation_integrity.py

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
